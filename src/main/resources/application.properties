spring.application.name=fintech-api

# Base de datos H2 en memoria (no requiere permisos de disco)
spring.datasource.url=jdbc:h2:mem:fintech_db;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Consola web de H2 para inspeccionar la base
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Ejecuta data.sql despues de que Hibernate cree las tablas (carga usuario de prueba)
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# DolarAPI - endpoint "bolsa" = Dolar MEP
dolar.api.url=https://dolarapi.com/v1/dolares/bolsa
